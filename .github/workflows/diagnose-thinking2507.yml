name: Diagnose Qwen3 4B Thinking 2507

on:
  push:
    branches: [main]
    paths:
      - trigger/diagnose-thinking2507.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-thinking2507-probe-v1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Inspect private kernels without GPU
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          echo '--- requested status ---'
          kaggle kernels status "${KERNEL_REF}" 2>&1 || true
          echo '--- recent kernels via CLI ---'
          kaggle kernels list --mine --sort-by dateCreated 2>&1 | head -n 80 || true
          echo '--- CLI help fallback ---'
          kaggle kernels list --help 2>&1 | head -n 160 || true
          echo '--- quota ---'
          kaggle quota --format json
