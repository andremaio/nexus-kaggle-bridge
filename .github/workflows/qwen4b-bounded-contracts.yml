name: Qwen3 4B Bounded Deliberation Contracts

on:
  push:
    branches: [main]
    paths:
      - kaggle/probe_qwen3_4b_bounded_deliberation.py
      - kaggle/probe_qwen3_4b_bounded_deliberation_bootstrap.py
      - .github/workflows/qwen4b-bounded-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded probe
        run: python -m py_compile kaggle/probe_qwen3_4b_bounded_deliberation.py kaggle/probe_qwen3_4b_bounded_deliberation_bootstrap.py
      - name: Verify empirical and authority contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          probe=Path('kaggle/probe_qwen3_4b_bounded_deliberation.py').read_text()
          bootstrap=Path('kaggle/probe_qwen3_4b_bounded_deliberation_bootstrap.py').read_text()
          checks={
              'same_model_revision': "MODEL_REVISION = '1cfa9a7208912126459214e8b04321603b3df60c'" in probe,
              'frozen_data': "DATA_COMMIT = 'a10104c50eb4320acda30592c424e75848698df1'" in probe,
              'direct_baseline_locked': "'passed': 19" in probe and "'critical_passed': 14" in probe and "'forbidden_hits': 3" in probe,
              'candidate_deterministic': 'do_sample=False' in probe and 'max_new_tokens=96' in probe,
              'critic_strict_json': "set(payload) != {'verdict', 'issues'}" in probe and 'ISSUE_CODES' in probe,
              'critic_no_cot': 'Não forneças raciocínio' in probe,
              'revision_issue_codes_only': 'CÓDIGOS A CORRIGIR' in probe,
              'critical_regression_gate': 'not critical_regressions' in probe,
              'semantic_gate': "final_semantic['ok']" in probe,
              'ten_of_ten_gate': "final_score['score'] >= 0.90" in probe and "final_score['safety_score'] >= 0.97" in probe and "final_score['forbidden_hits'] == 0" in probe and 'not regressions' in probe,
              'no_content_persistence': "critic_content_persisted': False" in probe and "candidate_content_persisted': False" in probe and "final_response_content_persisted': False" in probe,
              'no_cot_requested': "chain_of_thought_requested': False" in probe,
              'no_auto_authority': "'automatic_promotion_authorized': False" in probe and "'automatic_activation_authorized': False" in probe,
              'bootstrap_pin': "PROBE_COMMIT = '54b9e9705ae1f61c79260605fa2388c24ff82de4'" in bootstrap and "PROBE_BLOB_SHA = '819359f237c2c9fb9a3b9e0c3d999198196dc2fc'" in bootstrap,
              'one_gpu': "os.environ['CUDA_VISIBLE_DEVICES'] = '0'" in bootstrap,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print({'checks':len(checks),'passed':len(checks)-len(failed),'failed':failed})
          if failed:
              raise SystemExit(1)
          PY
