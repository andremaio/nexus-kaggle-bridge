name: Kaggle Auth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-auth.yml
      - trigger/auth.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN_MISSING"; exit 2; }
          echo "KAGGLE_API_TOKEN_PRESENT"
      - name: Install official Kaggle CLI
        run: python -m pip install --quiet "kaggle==2.2.4"
      - name: Authenticate and query quota
        shell: bash
        run: |
          set -euo pipefail
          kaggle --version
          kaggle quota --format json > quota.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('quota.json').read_text())
          print('KAGGLE_AUTH_OK')
          # Print only quota metadata; never print credentials.
          print(json.dumps(data, sort_keys=True))
          PY
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-auth-result
          path: quota.json
          if-no-files-found: ignore
          retention-days: 1
