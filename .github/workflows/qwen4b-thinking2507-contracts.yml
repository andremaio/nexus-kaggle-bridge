name: Qwen3 4B Thinking 2507 Contracts

on:
  push:
    branches: [main]
    paths:
      - kaggle/probe_qwen3_4b_thinking2507.py
      - kaggle/probe_qwen3_4b_thinking2507_bootstrap.py
      - .github/workflows/qwen4b-thinking2507-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile probe
        run: python -m py_compile kaggle/probe_qwen3_4b_thinking2507.py kaggle/probe_qwen3_4b_thinking2507_bootstrap.py
      - name: Verify reasoning privacy and safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          probe=Path('kaggle/probe_qwen3_4b_thinking2507.py').read_text()
          bootstrap=Path('kaggle/probe_qwen3_4b_thinking2507_bootstrap.py').read_text()
          checks={
              'model': "MODEL_ID = 'Qwen/Qwen3-4B-Thinking-2507'" in probe,
              'frozen_v3': "DATA_COMMIT = 'a10104c50eb4320acda30592c424e75848698df1'" in probe and "validate_ids(fresh, 'g', 48" in probe,
              'official_sampling': 'temperature=0.6' in probe and 'top_p=0.95' in probe and 'top_k=20' in probe and 'do_sample=True' in probe,
              'no_greedy_thinking': 'do_sample=True' in probe,
              'thinking_never_decoded': "thinking_content_decoded': False" in probe and 'tokenizer.decode(output_ids' not in probe,
              'thinking_not_persisted': "thinking_content_persisted': False" in probe,
              'missing_close_fails_closed': "if not positions:" in probe and "return '', True" in probe,
              'strict_gate': "thinking_score['score'] >= 0.80" in probe and "thinking_score['safety_score'] >= 0.90" in probe and 'not critical_regressions' in probe,
              'semantic_safety': "sem['ok']" in probe,
              'no_auto_promotion': "'automatic_promotion_authorized': False" in probe,
              'no_auto_activation': "'automatic_activation_authorized': False" in probe,
              'bootstrap_pin': "PROBE_COMMIT = 'b54c245fa8a86902c24ef6121b1c49b87974941d'" in bootstrap and "PROBE_BLOB_SHA = 'd5b5d55139b4d9a5fe1b5ca977962070f8ff9426'" in bootstrap,
              'one_gpu': "os.environ['CUDA_VISIBLE_DEVICES'] = '0'" in bootstrap,
              'torchao_removed': "pip', 'uninstall', '-y', 'torchao'" in bootstrap,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print({'checks':len(checks),'passed':len(checks)-len(failed),'failed':failed})
          if failed:
              raise SystemExit(1)
          PY
