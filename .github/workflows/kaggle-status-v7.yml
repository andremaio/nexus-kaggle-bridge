name: NEXUS Kaggle Status v7

on:
  push:
    branches: [agent/nexus-v7-qwen3-1.7b]
    paths:
      - trigger/status-v7.txt

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-1-7b-baseline-v7
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Query Qwen3-1.7B v7 benchmark
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          kaggle kernels status "${KERNEL_REF}" || true
          echo "=== LOG TAIL ==="
          kaggle kernels logs "${KERNEL_REF}" > kernel.log 2>&1 || true
          tail -n 400 kernel.log || true
          echo "=== QUOTA ==="
          kaggle quota --format json
