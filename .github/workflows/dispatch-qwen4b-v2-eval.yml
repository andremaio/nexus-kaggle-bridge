name: Dispatch Qwen3 4B v2 Eval

on:
  push:
    branches: [main]
    paths:
      - trigger/run-qwen4b-v2-eval.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected blind evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kaggle-eval-qwen3-4b-instruct2507-v2.yml --repo andremaio/nexus-kaggle-bridge --ref main
