name: NEXUS Qwen3 4B Instruct 2507 LoRA

on:
  push:
    branches: [main]
    paths:
      - trigger/train-qwen3-4b-instruct2507.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-lora-v1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight contracts and quota
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          python -m pip install --dry-run --quiet "transformers==5.14.1" "datasets==5.0.0" "peft==0.19.1" "trl==1.9.0" "accelerate==1.14.0"
          python -m py_compile kaggle/train_qwen3_4b_instruct2507_lora.py kaggle/train_qwen3_4b_instruct2507_bootstrap.py
          grep -F "MODEL_ID = 'Qwen/Qwen3-4B-Instruct-2507'" kaggle/train_qwen3_4b_instruct2507_lora.py
          grep -F "num_train_epochs=1.0" kaggle/train_qwen3_4b_instruct2507_lora.py
          grep -F "learning_rate=2e-5" kaggle/train_qwen3_4b_instruct2507_lora.py
          grep -F "contains_private_user_conversations': False" kaggle/train_qwen3_4b_instruct2507_lora.py
          grep -F "automatic_promotion_authorized':False" kaggle/train_qwen3_4b_instruct2507_lora.py
          grep -F "automatic_activation_authorized':False" kaggle/train_qwen3_4b_instruct2507_lora.py
          kaggle quota --format json | tee quota-before.json

      - name: Prepare private T4 training kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel && mkdir kernel
          cp kaggle/train_qwen3_4b_instruct2507_bootstrap.py kernel/
          cat > kernel/kernel-metadata.json <<'JSON'
          {
            "id":"andrmaio/nexus-qwen3-4b-instruct-2507-lora-v1",
            "title":"NEXUS Qwen3 4B Instruct 2507 LoRA v1",
            "code_file":"train_qwen3_4b_instruct2507_bootstrap.py",
            "language":"python",
            "kernel_type":"script",
            "is_private":true,
            "enable_gpu":true,
            "enable_tpu":false,
            "enable_internet":true,
            "machine_shape":"NvidiaTeslaT4",
            "keywords":[],
            "dataset_sources":[],
            "kernel_sources":[],
            "competition_sources":[],
            "model_sources":[]
          }
          JSON
          python -m json.tool kernel/kernel-metadata.json >/dev/null

      - name: Launch isolated training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p kernel --accelerator NvidiaTeslaT4 --timeout 10800 | tee launch.txt

      - name: Wait for training
        shell: bash
        run: |
          set -euo pipefail
          final=""
          for i in $(seq 1 480); do
            status="$(kaggle kernels status "${KERNEL_REF}" 2>&1 || true)"
            echo "$status" | tee status.txt
            low="$(echo "$status" | tr '[:upper:]' '[:lower:]')"
            if echo "$low" | grep -Eq 'complete|completed'; then final=complete; break; fi
            if echo "$low" | grep -Eq 'kernelworkerstatus\.error|error|failed|failure|cancel|404|not found'; then final=failed; break; fi
            sleep 20
          done
          [[ -n "$final" ]] || final=timeout
          echo "KAGGLE_FINAL_STATE=$final" >> "$GITHUB_ENV"

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "${KERNEL_REF}" > kernel.log 2>&1
          tail -n 1400 kernel.log || true
          kaggle quota --format json | tee quota-after.json
          if [[ "${KAGGLE_FINAL_STATE:-}" = complete ]]; then
            rm -rf output && mkdir output
            kaggle kernels output "${KERNEL_REF}" -p output -o
            find output -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | tee output-files.txt
            test -f output/qwen3-4b-instruct2507-lora-v1.json || exit 1
            test -f output/qwen3-4b-instruct2507-dataset-manifest-v1.json || exit 1
            test -f output/nexus-qwen3-4b-instruct2507-adapter-v1/adapter_config.json || exit 1
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/qwen3-4b-instruct2507-lora-v1.json').read_text())
          if r.get('schema')!='nexus.training.qwen3-4b-instruct2507-lora.v1': raise SystemExit('schema mismatch')
          for k in ('responses_persisted','automatic_training_authorized','automatic_promotion_authorized','automatic_activation_authorized','paid_service_used'):
              if r.get(k) is not False: raise SystemExit(f'invariant failed: {k}')
          print('FRESH_GAIN=' + str(r.get('fresh_gain')))
          print('FRESH_SAFETY_GAIN=' + str(r.get('fresh_safety_gain')))
          print('DECISION_GAIN=' + str(r.get('decision_gain')))
          print('DECISION_SAFETY_GAIN=' + str(r.get('decision_safety_gain')))
          print('SEMANTIC=' + json.dumps(r.get('adapted_semantic_safety'), sort_keys=True))
          print('FRESH_CRITICAL_REGRESSIONS=' + json.dumps((r.get('fresh_comparison') or {}).get('critical_regressions'), sort_keys=True))
          print('DECISION_CRITICAL_REGRESSIONS=' + json.dumps((r.get('decision_comparison') or {}).get('critical_regressions'), sort_keys=True))
          print('HUMAN_REVIEW_CANDIDATE=' + str(r.get('candidate_for_human_review')))
          print('TEN_OF_TEN_CANDIDATE=' + str(r.get('ten_of_ten_candidate')))
          Path('reports').mkdir(exist_ok=True)
          Path('reports/qwen3-4b-instruct2507-lora-v1.json').write_text(json.dumps(r,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
            tar -czf qwen3-4b-instruct2507-adapter-v1.tgz -C output nexus-qwen3-4b-instruct2507-adapter-v1
            git config user.name nexus-evidence-bot
            git config user.email nexus-evidence-bot@users.noreply.github.com
            git add reports/qwen3-4b-instruct2507-lora-v1.json
            git diff --cached --quiet || { git commit -m "evidence: record Qwen3 4B Instruct LoRA experiment"; git push origin HEAD:main; }
          fi

      - name: Upload training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qwen3-4b-instruct2507-lora-evidence
          path: |
            quota-before.json
            quota-after.json
            launch.txt
            status.txt
            kernel.log
            output-files.txt
            output/qwen3-4b-instruct2507-lora-v1.json
            output/qwen3-4b-instruct2507-lora-failure-v1.json
            output/qwen3-4b-instruct2507-dataset-manifest-v1.json
            qwen3-4b-instruct2507-adapter-v1.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail closed unless complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${KAGGLE_FINAL_STATE:-}" = complete
