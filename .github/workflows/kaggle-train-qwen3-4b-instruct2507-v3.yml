name: NEXUS Qwen3 4B Instruct 2507 LoRA v3

on:
  push:
    branches: [main]
    paths:
      - trigger/train-qwen3-4b-instruct2507-v3.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-lora-v3
    steps:
      - uses: actions/checkout@v4

      - name: Validate v3 isolation and immutable training contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          python -m py_compile kaggle/train_qwen3_4b_instruct2507_lora_v3.py kaggle/train_qwen3_4b_instruct2507_v3_bootstrap.py
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          att=json.loads(Path('reports/qwen4b-v3-isolation-attestation.json').read_text())
          required={
            'schema':'nexus.training.qwen4b-v3-isolation-attestation.v1',
            'holdout_cases':40,
            'training_examples_v7':32,
            'holdout_sha256':'b49124463a19415473cf161e784b6520ddca1dd3bcd776b7e48bf3946b1d080f',
            'training_sha256':'f7c36fbde0c92677641e0bee0077c4091870089dc1adb99d68ea0794e80676b9',
            'isolation_passed':True,
            'holdout_prompts_published':False,
            'holdout_available_to_training':False,
            'private_conversations_used':False,
            'automatic_promotion_authorized':False,
            'automatic_activation_authorized':False,
          }
          for k,v in required.items():
            if att.get(k)!=v: raise SystemExit(f'attestation mismatch: {k}')
          p=Path('training/seed_sft_v7_decision_boundary.jsonl')
          if hashlib.sha256(p.read_bytes()).hexdigest()!=required['training_sha256']:
            raise SystemExit('v7 training sha256 mismatch')
          rows=[json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          labels=Counter(str(r['messages'][-1]['content']).strip().upper() for r in rows)
          if len(rows)!=32 or labels!=Counter({'BLOCK':8,'VERIFY':8,'ALLOW':8,'DEFER':8}):
            raise SystemExit(f'v7 curriculum contract mismatch: {labels}')
          print('QWEN4B_V3_ISOLATION_OK')
          PY
          grep -F "learning_rate=5e-6" kaggle/train_qwen3_4b_instruct2507_lora_v3.py
          grep -F "r=8" kaggle/train_qwen3_4b_instruct2507_lora_v3.py
          grep -F "target_modules=['q_proj','k_proj','v_proj','o_proj']" kaggle/train_qwen3_4b_instruct2507_lora_v3.py
          grep -F "blind_holdout_available_to_training':False" kaggle/train_qwen3_4b_instruct2507_lora_v3.py
          grep -F "CUDA_VISIBLE_DEVICES'] = '0'" kaggle/train_qwen3_4b_instruct2507_v3_bootstrap.py
          kaggle quota --format json | tee quota-before.json

      - name: Prepare private T4 kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel && mkdir kernel
          cp kaggle/train_qwen3_4b_instruct2507_lora_v3.py kernel/
          cp kaggle/train_qwen3_4b_instruct2507_v3_bootstrap.py kernel/
          cat > kernel/kernel-metadata.json <<'JSON'
          {
            "id":"andrmaio/nexus-qwen3-4b-instruct-2507-lora-v3",
            "title":"NEXUS Qwen3 4B Instruct 2507 LoRA v3",
            "code_file":"train_qwen3_4b_instruct2507_v3_bootstrap.py",
            "language":"python",
            "kernel_type":"script",
            "is_private":true,
            "enable_gpu":true,
            "enable_tpu":false,
            "enable_internet":true,
            "machine_shape":"NvidiaTeslaT4",
            "keywords":[],
            "dataset_sources":[],
            "kernel_sources":[],
            "competition_sources":[],
            "model_sources":[]
          }
          JSON
          python -m json.tool kernel/kernel-metadata.json >/dev/null

      - name: Launch clean-base v3 training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p kernel --accelerator NvidiaTeslaT4 --timeout 9000 | tee launch.txt

      - name: Wait for training
        shell: bash
        run: |
          set -euo pipefail
          final=""
          for i in $(seq 1 360); do
            status="$(kaggle kernels status "${KERNEL_REF}" 2>&1 || true)"
            echo "$status" | tee status.txt
            low="$(echo "$status" | tr '[:upper:]' '[:lower:]')"
            if echo "$low" | grep -Eq 'complete|completed'; then final=complete; break; fi
            if echo "$low" | grep -Eq 'kernelworkerstatus\.error|error|failed|failure|cancel|404|not found|permission.*denied'; then final=failed; break; fi
            sleep 20
          done
          [[ -n "$final" ]] || final=timeout
          echo "KAGGLE_FINAL_STATE=$final" >> "$GITHUB_ENV"

      - name: Collect v3 adapter and report
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "${KERNEL_REF}" > kernel.log 2>&1
          tail -n 1400 kernel.log || true
          kaggle quota --format json | tee quota-after.json
          if [[ "${KAGGLE_FINAL_STATE:-}" = complete ]]; then
            rm -rf output && mkdir output
            kaggle kernels output "${KERNEL_REF}" -p output -o
            find output -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee output-files.txt
            test -f output/qwen3-4b-instruct2507-lora-v3.json || exit 1
            test -f output/nexus-qwen3-4b-instruct2507-adapter-v3/adapter_model.safetensors || exit 1
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/qwen3-4b-instruct2507-lora-v3.json').read_text())
          if r.get('schema')!='nexus.training.qwen3-4b-instruct2507-lora.v3': raise SystemExit('schema mismatch')
          if r.get('trained_from_clean_base') is not True: raise SystemExit('clean-base invariant failed')
          if r.get('evaluation_performed_in_training_kernel') is not False: raise SystemExit('evaluation isolation violated')
          if r.get('blind_holdout_available_to_training') is not False: raise SystemExit('blindness invariant violated')
          if r.get('automatic_promotion_authorized') is not False or r.get('automatic_activation_authorized') is not False: raise SystemExit('promotion invariant violated')
          if (r.get('dataset') or {}).get('examples') != 624: raise SystemExit('dataset count mismatch')
          print('TRAINING_LOSS=' + str((r.get('training') or {}).get('training_loss')))
          PY
            tar -czf qwen3-4b-instruct2507-adapter-v3.tgz -C output nexus-qwen3-4b-instruct2507-adapter-v3
          fi

      - name: Upload v3 training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qwen3-4b-instruct2507-lora-v3-evidence
          path: |
            reports/qwen4b-v3-isolation-attestation.json
            quota-before.json
            quota-after.json
            launch.txt
            status.txt
            kernel.log
            output-files.txt
            output/qwen3-4b-instruct2507-lora-v3.json
            output/qwen3-4b-instruct2507-dataset-manifest-v3.json
            qwen3-4b-instruct2507-adapter-v3.tgz
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail closed unless complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${KAGGLE_FINAL_STATE:-}" = complete
