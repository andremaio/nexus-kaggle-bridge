name: Qwen3 1.7B Live Status

on:
  push:
    branches: [main]
    paths:
      - trigger/qwen17-live-status.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-1-7b-challenger-probe
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Read current Kaggle state and logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          kaggle kernels status "${KERNEL_REF}" | tee qwen17-status.txt
          set +e
          kaggle kernels logs "${KERNEL_REF}" > qwen17-live.log 2>&1
          tail -n 500 qwen17-live.log
          kaggle quota --format json | tee quota-live.json
          exit 0
      - name: Upload live diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: qwen17-live-status
          path: |
            qwen17-status.txt
            qwen17-live.log
            quota-live.json
          retention-days: 1
