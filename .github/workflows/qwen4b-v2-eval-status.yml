name: Qwen3 4B v2 Eval Status

on:
  push:
    branches: [main]
    paths:
      - trigger/qwen4b-v2-eval-status.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-lora-v2-eval
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect evaluation kernel without relaunching
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          status="$(kaggle kernels status "${KERNEL_REF}" 2>&1 || true)"
          mkdir -p reports
          printf '%s\n' "$status" > reports/qwen4b-v2-eval-status.txt
          git config user.name nexus-status-bot
          git config user.email nexus-status-bot@users.noreply.github.com
          git add reports/qwen4b-v2-eval-status.txt
          git diff --cached --quiet || { git commit -m "diagnostic: record Qwen3 4B v2 eval state"; git push origin HEAD:main; }
