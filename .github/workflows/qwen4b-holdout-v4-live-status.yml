name: Qwen3 4B Holdout v4 Live Status

on:
  push:
    branches: [main]
    paths:
      - trigger/qwen4b-holdout-v4-live-status.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-holdout-v4-v1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing evaluation kernel only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          kaggle kernels status "${KERNEL_REF}" | tee holdout-v4-status.txt
          set +e
          kaggle kernels logs "${KERNEL_REF}" > holdout-v4-live.log 2>&1
          tail -n 800 holdout-v4-live.log
          kaggle quota --format json | tee holdout-v4-quota.json
          exit 0
