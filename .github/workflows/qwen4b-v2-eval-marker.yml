name: Qwen3 4B v2 Eval Marker

on:
  push:
    branches: [main]
    paths:
      - trigger/qwen4b-v2-eval-marker.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-lora-v2-eval
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exactly one evaluation-state marker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          status="$(kaggle kernels status "${KERNEL_REF}" 2>&1 || true)"
          low="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
          state=ABSENT
          if printf '%s' "$low" | grep -Eq 'running'; then state=RUNNING; fi
          if printf '%s' "$low" | grep -Eq 'queued'; then state=RUNNING; fi
          if printf '%s' "$low" | grep -Eq 'complete|completed'; then state=COMPLETE; fi
          if printf '%s' "$low" | grep -Eq 'kernelworkerstatus\.error|failed|failure|cancel'; then state=ERROR; fi
          if printf '%s' "$low" | grep -Eq 'permission.*denied'; then state=ABSENT; fi
          if printf '%s' "$low" | grep -Eq '404|not found'; then state=ABSENT; fi
          mkdir -p reports/qwen4b-v2-eval-state
          rm -f reports/qwen4b-v2-eval-state/*.marker
          printf '%s\n' "$status" > "reports/qwen4b-v2-eval-state/${state}.marker"
          git config user.name nexus-status-bot
          git config user.email nexus-status-bot@users.noreply.github.com
          git add -A reports/qwen4b-v2-eval-state
          git diff --cached --quiet || { git commit -m "diagnostic: mark Qwen3 4B v2 eval ${state}"; git push origin HEAD:main; }
