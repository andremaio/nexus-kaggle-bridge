name: NEXUS Qwen3 4B Instruct 2507 LoRA v2

on:
  push:
    branches: [main]
    paths:
      - trigger/train-qwen3-4b-instruct2507-v2.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-4b-instruct-2507-lora-v2
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Require clean isolation and training contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          python -m py_compile kaggle/train_qwen3_4b_instruct2507_lora_v2.py scripts/check_qwen4b_training_isolation.py
          python scripts/check_qwen4b_training_isolation.py | tee qwen4b-v2-isolation.json
          grep -F '"training_allowed": true' qwen4b-v2-isolation.json
          grep -F "learning_rate=1e-5" kaggle/train_qwen3_4b_instruct2507_lora_v2.py
          grep -F "evaluation_performed_in_training_kernel':False" kaggle/train_qwen3_4b_instruct2507_lora_v2.py
          grep -F "baseline_loaded_after_training':False" kaggle/train_qwen3_4b_instruct2507_lora_v2.py
          python -m pip install --dry-run --quiet "transformers==5.14.1" "datasets==5.0.0" "peft==0.19.1" "trl==1.9.0" "accelerate==1.14.0"
          kaggle quota --format json | tee quota-before.json

      - name: Prepare private T4 kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel && mkdir kernel
          cp kaggle/train_qwen3_4b_instruct2507_lora_v2.py kernel/
          cat > kernel/kernel-metadata.json <<'JSON'
          {
            "id":"andrmaio/nexus-qwen3-4b-instruct-2507-lora-v2",
            "title":"NEXUS Qwen3 4B Instruct 2507 LoRA v2",
            "code_file":"train_qwen3_4b_instruct2507_lora_v2.py",
            "language":"python",
            "kernel_type":"script",
            "is_private":true,
            "enable_gpu":true,
            "enable_tpu":false,
            "enable_internet":true,
            "machine_shape":"NvidiaTeslaT4",
            "keywords":[],
            "dataset_sources":[],
            "kernel_sources":[],
            "competition_sources":[],
            "model_sources":[]
          }
          JSON
          python -m json.tool kernel/kernel-metadata.json >/dev/null

      - name: Launch clean-base v2 training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p kernel --accelerator NvidiaTeslaT4 --timeout 9000 | tee launch.txt

      - name: Wait for training
        shell: bash
        run: |
          set -euo pipefail
          final=""
          for i in $(seq 1 360); do
            status="$(kaggle kernels status "${KERNEL_REF}" 2>&1 || true)"
            echo "$status" | tee status.txt
            low="$(echo "$status" | tr '[:upper:]' '[:lower:]')"
            if echo "$low" | grep -Eq 'complete|completed'; then final=complete; break; fi
            if echo "$low" | grep -Eq 'kernelworkerstatus\.error|error|failed|failure|cancel|404|not found|permission.*denied'; then final=failed; break; fi
            sleep 20
          done
          [[ -n "$final" ]] || final=timeout
          echo "KAGGLE_FINAL_STATE=$final" >> "$GITHUB_ENV"

      - name: Collect v2 adapter and report
        if: always()
        shell: bash
        run: |
          set +e
          kaggle kernels logs "${KERNEL_REF}" > kernel.log 2>&1
          tail -n 1200 kernel.log || true
          kaggle quota --format json | tee quota-after.json
          if [[ "${KAGGLE_FINAL_STATE:-}" = complete ]]; then
            rm -rf output && mkdir output
            kaggle kernels output "${KERNEL_REF}" -p output -o
            find output -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee output-files.txt
            test -f output/qwen3-4b-instruct2507-lora-v2.json || exit 1
            test -f output/nexus-qwen3-4b-instruct2507-adapter-v2/adapter_model.safetensors || exit 1
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/qwen3-4b-instruct2507-lora-v2.json').read_text())
          if r.get('schema')!='nexus.training.qwen3-4b-instruct2507-lora.v2': raise SystemExit('schema mismatch')
          if r.get('evaluation_performed_in_training_kernel') is not False: raise SystemExit('evaluation isolation violated')
          if r.get('baseline_loaded_after_training') is not False: raise SystemExit('baseline isolation violated')
          if r.get('automatic_promotion_authorized') is not False or r.get('automatic_activation_authorized') is not False: raise SystemExit('promotion invariant violated')
          if (r.get('dataset') or {}).get('examples') != 592: raise SystemExit('dataset count mismatch')
          print('TRAINING_LOSS=' + str((r.get('training') or {}).get('training_loss')))
          print('ADAPTER=' + json.dumps(r.get('adapter_files'), sort_keys=True))
          PY
            tar -czf qwen3-4b-instruct2507-adapter-v2.tgz -C output nexus-qwen3-4b-instruct2507-adapter-v2
          fi

      - name: Upload v2 training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qwen3-4b-instruct2507-lora-v2-evidence
          path: |
            qwen4b-v2-isolation.json
            quota-before.json
            quota-after.json
            launch.txt
            status.txt
            kernel.log
            output-files.txt
            output/qwen3-4b-instruct2507-lora-v2.json
            output/qwen3-4b-instruct2507-lora-v2-failure.json
            output/qwen3-4b-instruct2507-dataset-manifest-v2.json
            qwen3-4b-instruct2507-adapter-v2.tgz
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail closed unless complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${KAGGLE_FINAL_STATE:-}" = complete
