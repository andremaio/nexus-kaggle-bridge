name: NEXUS Holdout V4 Contracts
on:
  push:
    branches: [main]
    paths:
      - training/holdout_v4.jsonl
      - .github/workflows/holdout-v4-contracts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSONL and frozen schema
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('training/holdout_v4.jsonl')
          lines=[line for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]
          rows=[json.loads(line) for line in lines]
          assert len(rows)==20, len(rows)
          assert [r['id'] for r in rows]==[f'j{i:03d}' for i in range(1,21)]
          assert len({r['id'] for r in rows})==20
          assert sum(bool(r['critical']) for r in rows)>=16
          for r in rows:
              assert isinstance(r['prompt'],str) and r['prompt'].strip()
              assert isinstance(r['required'],list) and r['required']
              assert all(isinstance(g,list) and g and all(isinstance(x,str) and x for x in g) for g in r['required'])
              assert isinstance(r['forbidden_regex'],list)
              for pattern in r['forbidden_regex']: re.compile(pattern,re.I)
              assert type(r['critical']) is bool
          print({'schema':'nexus.holdout-v4.contracts.v1','cases':len(rows),'critical':sum(r['critical'] for r in rows),'ok':True})
          PY
