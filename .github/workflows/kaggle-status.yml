name: NEXUS Kaggle Status

on:
  push:
    branches: [main]
    paths:
      - trigger/status.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-0-6b-lora-v2
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Query Kaggle account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          echo "=== MY NEXUS KERNELS ==="
          kaggle kernels list -m -s nexus --page-size=20 -v --sort-by dateRun || true
          echo "=== DIRECT STATUS ==="
          kaggle kernels status "${KERNEL_REF}" || true
          echo "=== SAVED METADATA ==="
          rm -rf pulled-kernel
          mkdir pulled-kernel
          kaggle kernels pull "${KERNEL_REF}" -p pulled-kernel -m || true
          if [[ -f pulled-kernel/kernel-metadata.json ]]; then
            python - <<'PY'
          import json
          p='pulled-kernel/kernel-metadata.json'
          d=json.load(open(p))
          safe={k:d.get(k) for k in ['id','title','language','kernel_type','is_private','enable_gpu','enable_tpu','enable_internet','machine_shape','docker_image']}
          print(json.dumps(safe, sort_keys=True))
          PY
          fi
          echo "=== KERNEL LOG TAIL ==="
          kaggle kernels logs "${KERNEL_REF}" > kernel.log 2>&1 || true
          tail -n 240 kernel.log || true
          echo "=== FILES (best effort) ==="
          kaggle kernels files "${KERNEL_REF}" --page-size=20 -v || true
          echo "=== QUOTA ==="
          kaggle quota --format json
