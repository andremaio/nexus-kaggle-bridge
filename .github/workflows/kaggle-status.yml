name: NEXUS Kaggle Status

on:
  push:
    branches: [main]
    paths:
      - trigger/status.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-06b-lora-v2
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Query Kaggle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          echo "=== STATUS ==="
          kaggle kernels status "${KERNEL_REF}"
          echo "=== QUOTA ==="
          kaggle quota --format json
