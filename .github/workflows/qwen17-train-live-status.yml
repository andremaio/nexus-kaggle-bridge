name: Qwen3 1.7B Train Live Status

on:
  push:
    branches: [main]
    paths:
      - trigger/qwen17-train-live-status.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: andrmaio/nexus-qwen3-1-7b-lora-v1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Read current training state and logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install --quiet "kaggle==2.2.4"
          kaggle kernels status "${KERNEL_REF}" | tee qwen17-train-status.txt
          set +e
          kaggle kernels logs "${KERNEL_REF}" > qwen17-train-live.log 2>&1
          tail -n 700 qwen17-train-live.log
          kaggle quota --format json | tee qwen17-train-quota.json
          exit 0
      - name: Upload training diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: qwen17-train-live-status
          path: |
            qwen17-train-status.txt
            qwen17-train-live.log
            qwen17-train-quota.json
          retention-days: 1
